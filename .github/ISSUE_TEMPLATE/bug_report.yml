name: Bug report
description: Something does not work as described.
title: "bug: "
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for the report. Please search existing issues first. For security problems, follow SECURITY.md instead of opening a public issue.
  - type: textarea
    id: what-happened
    attributes:
      label: What happened
      description: What did you see, and what did you expect to see?
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Go to ...
        2. Click ...
        3. See ...
    validations:
      required: true
  - type: input
    id: browser
    attributes:
      label: Browser and OS
      placeholder: Firefox 140 on Windows 11
    validations:
      required: true
  - type: input
    id: url
    attributes:
      label: Page or URL
      description: Where it happened, for example the live demo or a local `npm run dev` server.
  - type: textarea
    id: extra
    attributes:
      label: Screenshots or logs
      description: Optional. Paste console output or attach a screenshot.
